
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamVault Admin</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f2fc;
    color: #292342;
}

header {
    background: #5636a5;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    font-size: 21px;
}

header button {
    background: white;
    color: #5636a5;
    margin: 0;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #ddd5ee;
    margin-bottom: 22px;
}

h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd5ee;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    background: white;
}

input:focus, select:focus {
    border-color: #7954ca;
}

button {
    background: #6241b3;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 18px;
}

button:hover {
    background: #43258e;
}

.logout {
    background: white;
    color: #5636a5;
}

.delete {
    background: #d94354;
    margin-top: 5px;
}

.paper {
    border: 1px solid #eee8f8;
    border-radius: 10px;
    padding: 16px;
    margin: 12px 0;
}

.paper p {
    margin: 7px 0;
    font-size: 14px;
    color: #777;
}

.hidden {
    display: none;
}

#message {
    margin-top: 15px;
    font-size: 14px;
}

@media(max-width:600px) {
    .card {
        padding: 18px;
    }

    header h2 {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<header>
    <h2>📚 ExamVault Admin</h2>
    <button class="logout hidden" id="logout"
        onclick="logout()">Logout</button>
</header>

<div class="container">

    <!-- LOGIN SECTION -->

    <div class="card" id="loginSection">

        <h2>Admin Login 🔐</h2>

        <label>Username</label>
        <input type="text" id="username"
            placeholder="Enter username">

        <label>Password</label>
        <input type="password" id="password"
            placeholder="Enter password">

        <button onclick="login()">Login</button>

        <p id="loginMessage"></p>

    </div>


    <!-- ADMIN DASHBOARD -->

    <div id="dashboard" class="hidden">

        <div class="card">

            <h2>➕ Add Question Paper</h2>

            <form id="paperForm">

                <label>Subject Name</label>
                <input type="text" id="subject"
                    placeholder="Example: Software Engineering"
                    required>

                <label>University</label>
                <select id="university" required>
                    <option value="">Select University</option>
                    <option>Calicut University</option>
                    <option>KTU</option>
                    <option>Other</option>
                </select>

                <label>Semester</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option>S1</option>
                    <option>S2</option>
                    <option>S3</option>
                    <option>S4</option>
                    <option>S5</option>
                    <option>S6</option>
                    <option>S7</option>
                    <option>S8</option>
                </select>

                <label>Examination Year</label>
                <input type="number" id="year"
                    min="2000" max="2100"
                    placeholder="2025" required>

                <label>Subject Code</label>
                <input type="text" id="code"
                    placeholder="Example: CST301">

                <label>Upload Question Paper (PDF)</label>
                <input type="file" id="pdf"
                    accept="application/pdf" required>

                <button type="submit">Upload Paper</button>

                <p id="message"></p>

            </form>

        </div>


        <!-- UPLOADED PAPERS -->

        <div class="card">

            <h2>📄 Uploaded Papers</h2>

            <div id="paperList"></div>

        </div>

    </div>

</div>

<script>

// DEMO LOGIN ONLY
// This is not secure authentication.

const ADMIN_USER = "sana";
const ADMIN_PASS = "sananazar";

let papers = [];

try {
    papers = JSON.parse(
        localStorage.getItem("examVaultPapers") || "[]"
    );l
} catch (error) {
    papers = [];
}

// LOGIN

function login() {

    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if (user === ADMIN_USER && pass === ADMIN_PASS) {

        sessionStorage.setItem("examAdmin", "true");

        showDashboard();

    } else {

        document.getElementById("loginMessage").textContent =
            "Incorrect username or password!";

    }

}

// SHOW DASHBOARD

function showDashboard() {

    document.getElementById("loginSection")
        .classList.add("hidden");

    document.getElementById("dashboard")
        .classList.remove("hidden");

    document.getElementById("logout")
        .classList.remove("hidden");

    displayPapers();

}

// LOGOUT

function logout() {

    sessionStorage.removeItem("examAdmin");

    location.reload();

}

// SAVE PAPERS

function savePapers() {

    try {

        localStorage.setItem(
            "examVaultPapers",
            JSON.stringify(papers)
        );

        return true;

    } catch (error) {

        alert(
            "Storage is full! Try a smaller PDF or remove old papers."
        );

        return false;

    }

}

// UPLOAD PAPER

document.getElementById("paperForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const file = document.getElementById("pdf").files[0];

    if (!file) {
        alert("Please select a PDF!");
        return;
    }

    if (file.type !== "application/pdf") {
        alert("Only PDF files are allowed!");
        return;
    }

    // Keep file size manageable for browser storage.
    if (file.size > 500 * 1024) {
        alert("PDF must be smaller than 500 KB in this demo.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function() {

        const newPaper = {

            id: Date.now(),

            subject: document.getElementById("subject").value,

            university: document.getElementById("university").value,

            semester: document.getElementById("semester").value,

            year: document.getElementById("year").value,

            code: document.getElementById("code").value,

            pdf: reader.result

        };

        papers.unshift(newPaper);

        if (savePapers()) {

            document.getElementById("message").textContent =
                "Paper uploaded successfully! 🎉";

            document.getElementById("paperForm").reset();

            displayPapers();

        } else {

            papers.shift();

        }

    };

    reader.readAsDataURL(file);

});

// DISPLAY PAPERS

function displayPapers() {

    const list = document.getElementById("paperList");

    list.innerHTML = "";

    if (papers.length === 0) {

        list.innerHTML = "<p>No papers uploaded yet.</p>";

        return;

    }

    papers.forEach(paper => {

        const div = document.createElement("div");

        div.className = "paper";

        const title = document.createElement("h3");
        title.textContent = "📄 " + paper.subject;

        const details = document.createElement("p");

        details.textContent =
            paper.university + " | " +
            paper.semester + " | " +
            paper.year;

        const view = document.createElement("button");
        view.textContent = "View PDF";

        view.onclick = function() {
            const win = window.open();
            if (win) {
                win.document.write(
                    '<iframe src="' + paper.pdf +
                    '" style="width:100%;height:100vh;border:0"></iframe>'
                );
                win.document.close();
            }
        };

        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.className = "delete";

        remove.onclick = function() {
            deletePaper(paper.id);
        };

        div.appendChild(title);
        div.appendChild(details);
        div.appendChild(view);
        div.appendChild(remove);

        list.appendChild(div);

    });

}

// DELETE PAPER

function deletePaper(id) {

    if (!confirm("Are you sure you want to delete this paper?")) {
        return;
    }

    const oldPapers = papers;

    papers = papers.filter(paper => paper.id !== id);

    if (savePapers()) {
        displayPapers();
    } else {
        papers = oldPapers;
    }

}

// AUTO LOGIN FOR CURRENT TAB SESSION

if (sessionStorage.getItem("examAdmin") === "true") {
    showDashboard();
}

</script>

</body>
</html>
